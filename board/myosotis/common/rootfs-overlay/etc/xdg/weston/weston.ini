[core]
idle-time=0
require-input=false

[libinput]
enable-tap=true
natural-scroll=false
left-handed=false

[shell]
background-image=/usr/share/myosotis/wallpaper.png
background-type=scale-crop
background-color=0xff0c1026
panel-color=0xcc141a33
panel-position=top
clock-format=minutes-24h
locking=false
animation=fade
close-animation=fade
startup-animation=fade
allow-zap=true

[launcher]
icon=/usr/share/icons/hicolor/64x64/apps/myosotis-terminal.png
path=/usr/bin/foot
displayname=Terminal

[launcher]
icon=/usr/share/icons/hicolor/64x64/apps/myosotis-mixer.png
path=/usr/bin/myosotis-mixer
displayname=Audio mixer

[output]
name=Virtual-1
mode=1280x800
scale=1

[keyboard]
keymap_rules=evdev
keymap_model=pc105
keymap_layout=us
repeat-rate=40
repeat-delay=400

[autolaunch]
path=/usr/bin/myosotis-autostart
watch=false
