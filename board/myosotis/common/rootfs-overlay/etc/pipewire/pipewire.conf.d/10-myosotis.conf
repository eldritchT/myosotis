# Myosotis Linux audio tuning.
#
# 48 kHz is the native rate of most HDMI/USB audio devices and of the
# QEMU HDA codec; keep a reasonably large quantum so software mixing
# stays glitch-free on machines without real-time scheduling.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 2048
}
